[EXP]
root = results/
name = age25_jess
epochs = 100
#type = regression
type = classification
[DATA]
type = continuous
databases = ['data', 'jess']
data = databases/tub-age25/data.csv
data.type = csv
data.absolute_path = False
data.colnames = {"sex":"gender"}
data.mapping = {'gender':{'m':'male', 'f':'female'}}
data.split_strategy = ['sofia_0_f_25', 'sofia_3_m_54', 'sofia_9_f_93', 'sonja_01_f_31', 'sonja_03_m_50', 'sonja_04_f_102', 'sonja_05_m_40', 'sonja_07_m_29', 'sonja_08_f_23', 'sonja_10_f_71', 'nadja_1_f_49', 'nadja_2_f_96', 'nadja_5_m_39', 'nadja_7_m_60', 'bruno_2_f_26', 'bruno_3_f_26', 'bruno_4_m_45', 'bruno_6_m_36', 'bruno_8_m_24', 'bruno_9_m_27', 'Pepe1_M_23', 'Pepe1_M_39', 'Pepe1_M_44', 'Pepe1_M_61', 'Pepe1_W_22']
#balance = {'age':2, 'gender':1}
#data.test_size = 50
jess = ../nkululeko/data/jess/jess.csv
jess.type = csv
jess.absolute_path = False
jess.root_folders = ./data/jess
jess.split_strategy = train
# text = ['read_text', 'spontaneous', 'sentence', 'syllable', 'vowel']
jess.filter = [['text','sentence']]
# 10 samples per speaker should be sufficient
jess.limit_samples_per_speaker = 10
# Target: age classification
target = age
labels = ['young', 'old']
bins  = [-100000, 40, 100000]
[FEATS]
type = ["os"]
#type = ["praat"]
#type = ["agender"]
scale = standard
#features = ['ddaShimmer', 'mff', 'HNR', 'ddpJitter', 'f4_median', 'f3_median', 'fitch_vtl']
[MODEL]
type = xgb
#type = mlp
#layers = [1024, 256]
# learning_rate = .0001
# batch_size = 16
#type = xgbsvm
#C_val = 1
# logo = 5
#type = mlp_reg
#layers = {'l1':256, 'l2':16}
#measure = ccc
#loss = 1-ccc
#patience = 10
[RESAMPLE]
sample_selection = all
replace = True
[AUGMENT]
# select the samples to augment: either train, test, or all
sample_selection = train
# select the method(s)
augment = ['traditional']
augmentations = Compose([AddGaussianNoise(min_amplitude=0.001, max_amplitude=0.05),Shift(p=0.5),BandPassFilter(min_center_freq=100.0, max_center_freq=6000),])
[SEGMENT]
method = silero
segment_target = _segmented
sample_selection = all
# the minimum lenght of rest-samples (in seconds)
min_length = 2
# the maximum length of segments, longer ones are cut here.  (in seconds)
max_length = 10
[EXPL]
sample_selection = all 
# value_counts = [['sex'], ['duration']] 
feature_distributions = True
model = ['tree', 'gmm', 'svm']
permutation = True
max_feats = 7
scatter = ['tsne']
scatter.dim = 3
[PLOT]
#epoch_progression = True
#best_model = True
